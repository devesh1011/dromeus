name: Release dromeus-axl

# Pushing a tag dromeus-axl-vX.Y.Z builds the AXL platform wheels from the
# pinned commit, starts each one on a runner of its own platform, then
# publishes to TestPyPI and PyPI through trusted publishing (OIDC).
on:
  push:
    tags: ["dromeus-axl-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.6"
          cache: false
      - name: Tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('packages/dromeus-axl/pyproject.toml', 'rb'))['project']['version'])")
          if [ "dromeus-axl-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match dromeus-axl version $version" >&2
            exit 1
          fi
      - name: Build the platform wheels
        run: python scripts/build_axl_wheels.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            wheel: "*manylinux_2_17_x86_64.whl"
          - runner: ubuntu-24.04-arm
            wheel: "*manylinux_2_17_aarch64.whl"
          - runner: macos-latest
            wheel: "*macosx_12_0_arm64.whl"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install and start the bundled AXL
        run: uv run --no-project --python 3.12 python scripts/build_axl_wheels.py --smoke-wheel dist/${{ matrix.wheel }}

  publish-testpypi:
    needs: smoke
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
