[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dromeus"
version = "0.3.0"
description = "Decentralized federated learning over AXL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Dromeus contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
    "msgpack>=1.1,<2",
    "numpy>=2,<3",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0,<7",
    "safetensors>=0.5,<1",
    "torch>=2.7,<3",
]

[project.optional-dependencies]
privacy = ["opacus==1.6.0"]
benchmark = [
    "datasets>=3,<5",
    "pillow>=10,<13",
    "tiktoken==0.14.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "datasets>=3,<5",
  "pillow>=10,<13",
  "matplotlib>=3.9,<4",
  "pyright>=1.1.400",
  "pytest>=8.4",
  "ruff>=0.12",
  "tiktoken==0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dromeus"]

[tool.hatch.build.targets.sdist]
# Runtime source only. Benchmark evidence is distributed separately.
only-include = ["src", "pyproject.toml", "README.md", "LICENSE"]

[tool.pyright]
extraPaths = [".", "src", "tests"]
include = ["src", "tests", "benchmarks"]
# Captured run source is immutable evidence, not maintained benchmark code.
# Maintained benchmark and report modules remain under strict checks.
exclude = [
  "benchmarks/results/m3",
  # W0's standalone Opacus experiment runs in an isolated optional environment.
  "benchmarks/m3/compatibility_spike.py",
  "benchmarks/m3/cuda_spike.py",
  "benchmarks/m3/secure_rng_spike.py",
  "benchmarks/m3/optimizer_profile_spike.py",
]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
