[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dromeus"
version = "0.4.0rc1"
description = "Decentralized federated learning over AXL"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["federated learning", "decentralized training", "pytorch", "differential privacy", "peer-to-peer", "AXL"]
authors = [{ name = "Dromeus contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = [
    # The pinned AXL node, on every platform PyTorch and AXL both support.
    "dromeus-axl==0.1.0; (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'darwin' and platform_machine == 'arm64')",
    "msgpack>=1.1,<2",
    "numpy>=2,<3",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0,<7",
    "safetensors>=0.5,<1",
    "torch>=2.7,<3",
]

[project.urls]
Homepage = "https://dromeus.mintlify.app"
Documentation = "https://dromeus.mintlify.app"
Repository = "https://github.com/devesh1011/dromeus"
Issues = "https://github.com/devesh1011/dromeus/issues"
Changelog = "https://github.com/devesh1011/dromeus/blob/main/CHANGELOG.md"

[project.scripts]
dromeus = "dromeus.cli:main"

[project.optional-dependencies]
privacy = ["opacus==1.6.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dromeus"]

[tool.hatch.build.targets.sdist]
# Runtime source only. Benchmark evidence is distributed separately.
only-include = ["src", "pyproject.toml", "README.md", "LICENSE"]

[tool.pyright]
extraPaths = [".", "src", "tests", "packages/dromeus-axl/src"]
include = ["src", "tests", "benchmarks", "packages/dromeus-axl/src"]
# Retained results are frozen evidence for their tagged release, not code
# maintained against the current library.
exclude = ["benchmarks/results"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# The oldest supported Python: newer syntax in the library fails lint.
target-version = "py311"
# Lint only the installed libraries; benchmarks, tests and frozen results are excluded.
include = ["src/dromeus/**/*.py", "packages/dromeus-axl/src/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
