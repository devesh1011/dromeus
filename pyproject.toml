[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dromeus"
version = "0.1.0"
description = "Decentralized federated learning over AXL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Dromeus contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
    "datasets>=3,<5",
    "msgpack>=1.1,<2",
    "numpy>=2,<3",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0,<7",
    "safetensors>=0.5,<1",
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dromeus"]

[tool.pyright]
include = ["src", "tests", "benchmarks"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
